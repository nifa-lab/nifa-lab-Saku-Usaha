name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" "build-tools;36.0.0"

      # Proyek ini tidak menyertakan gradlew / gradle-wrapper.jar,
      # jadi Gradle dipasang langsung sesuai gradle-wrapper.properties (9.3.1).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # build.gradle.kts mengharapkan debug.keystore di root proyek.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --no-configuration-cache 2>&1 | tee build.log

      # Jika build gagal, tampilkan ringkasan penyebabnya di akhir log.
      - name: Show error summary
        if: failure()
        run: |
          echo "=============== RINGKASAN ERROR ==============="
          grep -n -A25 "What went wrong" build.log || tail -n 60 build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SakuUsaha-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Release APK (opsional): hanya jalan jika secrets sudah diisi ----
      - name: Check release secrets
        id: release_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.release_check.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle assembleRelease --console=plain

      - name: Upload release APK
        if: steps.release_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SakuUsaha-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
